version: 2

models:
  - name: stg_transactions
    description: One row per deduplicated transaction. Has a derived timestamp and feature score.
    columns:
      - name: transaction_id
        data_tests: [unique, not_null]
      - name: transaction_ts
        data_tests: [not_null]
      - name: amount
        data_tests: [not_null]
      - name: is_fraudulent
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
